[package]
name = "zx-spectrum-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "zx_spectrum_machine_plugin_impl"

[dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
machine = { path = "../../../../../shared/crates/machine" }
plugin-api = { path = "../../../../../shared/crates/plugin-api" }
serde = { version = "1", features = ["derive"] }
z80 = { path = "../../../../../shared/crates/core/z80" }
zx-spectrum = { path = "../../machines/zx-spectrum" }
z80-snapshot = { path = "../../formats/z80-snapshot" }
sna-snapshot = { path = "../../formats/sna-snapshot" }
szx-snapshot = { path = "../../formats/szx-snapshot" }
zx-tape = { path = "../../../../../shared/crates/formats/zx-tape" }
dsk = { path = "../../../../../shared/crates/formats/dsk" }

[dev-dependencies]
plugin-api = { path = "../../../../../shared/crates/plugin-api", features = ["testkit"] }
toml = "0.8"

[build-dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }

[features]
debug = ["zx-spectrum/debug"]
