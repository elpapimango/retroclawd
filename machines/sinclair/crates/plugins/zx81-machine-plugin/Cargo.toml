[package]
name = "zx81-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "zx81_machine_plugin_impl"

[dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
machine = { path = "../../../../../shared/crates/machine" }
serde = { version = "1", features = ["derive"] }
plugin-api = { path = "../../../../../shared/crates/plugin-api" }
z80 = { path = "../../../../../shared/crates/core/z80" }
zx81 = { path = "../../machines/zx81" }
zx81-snapshot = { path = "../../formats/zx81-snapshot" }
zx-tape = { path = "../../../../../shared/crates/formats/zx-tape" }

[dev-dependencies]
plugin-api = { path = "../../../../../shared/crates/plugin-api", features = ["testkit"] }
toml = "0.8"

[build-dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
