[package]
name = "zx81-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "zx81_machine_plugin_impl"

[dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
machine = { package = "rc-machine", version = "0.1" }
serde = { version = "1", features = ["derive"] }
plugin-api = { path = "../../../../../shared/crates/plugin-api" }
z80 = { package = "rc-z80", version = "0.1" }
zx81 = { path = "../../machines/zx81" }
zx81-snapshot = { package = "rc-zx81-snapshot", version = "0.1" }
zx-tape = { package = "rc-zx-tape", version = "0.1" }
[dev-dependencies]
plugin-api = { path = "../../../../../shared/crates/plugin-api", features = ["testkit"] }
toml = "0.8"

[build-dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }

[features]
debug = ["zx81/debug"]
