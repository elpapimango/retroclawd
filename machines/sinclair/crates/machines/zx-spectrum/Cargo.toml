[package]
name = "zx-spectrum"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
z80 = { package = "rc-z80", version = "0.1" }
machine = { package = "rc-machine", version = "0.1" }
sinclair-keyboard = { path = "../../chips/sinclair-keyboard" }
z80-snapshot = { package = "rc-z80-snapshot", version = "0.1" }
sna-snapshot = { package = "rc-sna-snapshot", version = "0.1" }
szx-snapshot = { package = "rc-szx-snapshot", version = "0.1" }
ay-3-8910 = { path = "../../../../../shared/crates/chips/ay-3-8910" }
zx-tape = { package = "rc-zx-tape", version = "0.1" }
nec765 = { path = "../../../../../shared/crates/chips/nec765", features = ["dsk"] }
dsk = { package = "rc-dsk", version = "0.1" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }

[features]
# Port watch points. Off in `rcd`, on in `rcdd`.
debug = ["machine/debug"]
