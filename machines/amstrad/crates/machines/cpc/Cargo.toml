[package]
name = "cpc"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
machine = { path = "../../../../../shared/crates/machine" }
z80 = { path = "../../../../../shared/crates/core/z80" }
ay-3-8910 = { path = "../../../../../shared/crates/chips/ay-3-8910" }
i8255 = { path = "../../chips/i8255" }
nec765 = { path = "../../../../../shared/crates/chips/nec765", features = ["dsk"] }
dsk = { path = "../../../../../shared/crates/formats/dsk" }
cpc-snapshot = { path = "../../formats/cpc-snapshot" }
zx-tape = { path = "../../../../../shared/crates/formats/zx-tape" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
tracing = "0.1"

[features]
# Port watch points. Off in `rcd`, on in `rcdd`.
debug = ["machine/debug"]
