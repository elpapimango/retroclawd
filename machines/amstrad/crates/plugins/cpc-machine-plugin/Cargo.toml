[package]
name = "cpc-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "cpc_machine_plugin_impl"

[dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
machine = { package = "rc-machine", version = "0.1" }
plugin-api = { path = "../../../../../shared/crates/plugin-api" }
serde = { version = "1", features = ["derive"] }
z80 = { package = "rc-z80", version = "0.1" }
cpc = { path = "../../machines/cpc" }
zx-tape = { package = "rc-zx-tape", version = "0.1" }
dsk = { package = "rc-dsk", version = "0.1" }
cpc-cartridge = { package = "rc-cpc-cartridge", version = "0.1" }
cpc-snapshot = { package = "rc-cpc-snapshot", version = "0.1" }
tracing = "0.1"

[dev-dependencies]
plugin-api = { path = "../../../../../shared/crates/plugin-api", features = ["testkit"] }
toml = "0.8"

[build-dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }

[features]
debug = ["cpc/debug"]
