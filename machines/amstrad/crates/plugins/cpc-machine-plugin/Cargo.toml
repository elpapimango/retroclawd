[package]
name = "cpc-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "cpc_machine_plugin_impl"

[dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
machine = { path = "../../../../../shared/crates/machine" }
plugin-api = { path = "../../../../../shared/crates/plugin-api" }
serde = { version = "1", features = ["derive"] }
z80 = { path = "../../../../../shared/crates/core/z80" }
cpc = { path = "../../machines/cpc" }
zx-tape = { path = "../../../../../shared/crates/formats/zx-tape" }
dsk = { path = "../../../../../shared/crates/formats/dsk" }
cpc-cartridge = { path = "../../formats/cpc-cartridge" }
cpc-snapshot = { path = "../../formats/cpc-snapshot" }
tracing = "0.1"

[dev-dependencies]
plugin-api = { path = "../../../../../shared/crates/plugin-api", features = ["testkit"] }
toml = "0.8"

[build-dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
