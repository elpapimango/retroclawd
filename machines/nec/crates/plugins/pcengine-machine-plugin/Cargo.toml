[package]
name = "pcengine-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "pcengine_machine_plugin_impl"

[dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
plugin-api = { path = "../../../../../shared/crates/plugin-api" }
huc6280 = { package = "rc-huc6280", version = "0.1" }
serde = { version = "1", features = ["derive"] }
pcengine = { path = "../../machines/pcengine" }

[build-dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }

[features]
# Reserved: the debug build forwards its feature here like the other plugins.
debug = []
