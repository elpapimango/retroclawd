# S4: pce-tone.pce plays channel 0 as a 32-step square wave at frequency register $0FE and full level. Beetle PCE Fast makes 441 Hz at an RMS
# of 0.1604 (a full-scale square: amplitude 0.16); so do we (the pitch is 3 579 545 / (32 x 254) = 440.4 Hz).
[[scenario]]
id = "S4"
kind = "audio"
frames = 180
files = { rom = "nec/software/scenarios/pce-tone.pce" }
audio = { from_s = 1.0, to_s = 2.8, tone_hz = 441.0, tone_tolerance_pct = 1.0, min_amplitude = 0.14 }

# S5: a save state taken mid-game and loaded again continues as the same machine.
[[scenario]]
id = "S5"
kind = "state"
frames = 200
more_frames = 100
files = { rom = "nec/software/roms/airzonk.pce" }

# S6: the colour encoder's long frame is 263 lines of 455 CPU cycles (1365 master clocks); Beetle PCE Fast runs 59.82 frames a second
# (21 477 272 / 59.82 = 359 030 clocks), we 358 995 (59.83).
[[scenario]]
id = "S6"
kind = "timing"
frames = 100
files = { rom = "nec/software/roms/airzonk.pce" }
cycles_per_frame = 358995
cycles_tolerance = 100

# Lady Sword (a 1 MB card) wants backup memory at start-up: with the backup unit (facts M9, M10) it saves its record there and goes on to its
# title like the reference (closed 2026-11-27; the backup RAM after 600 frames is byte for byte the reference's).
[[scenario]]
id = "G-ladysword-600"
kind = "screen"
frames = 600
files = { rom = "nec/software/roms/ladysword.pce" }
golden = "pcengine/G-ladysword-600.png"
golden_sha256 = "ae86b34f359f0cc1ca91e0436d4a6d0e04b5714198c017f43f23e16d3778e59c"
compare = { mode = "similarity", max_mad = 2.0, reason = "another emulator's rasterisation after scaling 256 to 512 columns (measured 0.18)" }
