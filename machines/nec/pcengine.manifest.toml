files = { rom = "nec/software/roms/gradius.pce" }
golden = "pcengine/S3-gradius-600.png"
golden_sha256 = "fbb6c1fdcd7e7301496254e41591adbacbdab6a886537808c7884cd9bc0e0e3b"
compare = { mode = "similarity", max_mad = 4.0, reason = "another emulator's frame timing: the title screen scrolls and the pictures are a few frames apart" }

