machine = "pcengine"
# every run starts with a newly formatted backup RAM and keeps no file (the default file would carry saves from run to run)
args = ["--backup-ram", "none"]
# The games come from the owner's RomM server (platform 130) by scenarios/capture_pce_goldens.py into software/roms/; the test cards come from
# scenarios/build.py (software/scenarios/). Neither is committed. The goldens are Beetle PCE Fast's pictures (Mednafen's PC Engine core, through
# its libretro build), never committed; capture_pce_goldens.py prints their hashes.
# A HuCard needs no firmware. The CD-ROM unit and the System Card are not emulated (S7 has no hardware test ROM for the HuCard; there is no
# CD-ROM content or System Card on the server), see docs/pcengine-gaps.md.

[reference]
emulator = "beetle-pce-fast"
version = "1.31.0.0 (Mednafen PC Engine, libretro core)"
command = "machines/nec/scenarios/capture_pce_goldens.py (libretro_run.py with mednafen_pce_fast_libretro, --device 0=1)"

# The reference shows a 256x243 picture where we show 512x243 of the same lines: only the content is compared, by similarity.

# S1: Air Zonk's Hudson legal screen (frame 160: text only, 2 pictures of sprites on black) and its title scene (frame 600: a city skyline, background and
# sprites, palette fades finished).
[[scenario]]
id = "S1-airzonk-160"
kind = "screen"
frames = 160
files = { rom = "nec/software/roms/airzonk.pce" }
golden = "pcengine/S1-airzonk-160.png"
golden_sha256 = "26f73b39d19071793b6041975f9fb794933a52dc6f47e7cc3a16c781b058764f"
compare = { mode = "similarity", max_mad = 1.0, reason = "another emulator's rasterisation: glyph edges are drawn at a different sub-pixel position after scaling 256 to 512 columns" }

[[scenario]]
id = "S1-airzonk-600"
kind = "screen"
frames = 600
files = { rom = "nec/software/roms/airzonk.pce" }
golden = "pcengine/S1-airzonk-600.png"
golden_sha256 = "0c75536dfb0d9ccacec16f946b219667ca576338676930e227cc3d771d6bf610"
compare = { mode = "similarity", max_mad = 4.0, reason = "another emulator's frame timing: the title scene is animated (the hero's lightning bolt, a flying object) a few frames apart; the building and sky agree" }

# S2: pce-input.pce draws the first pad's eight inputs as eight squares; holding button I and Run lights the first and the fourth. The reference's
# RetroPad A is button I, B is button II, Start is Run.
[[scenario]]
id = "S2-pad"
kind = "screen"
frames = 40
files = { rom = "nec/software/scenarios/pce-input.pce" }
actions = ["10:key_down=Joy1I", "10:key_down=Joy1Run"]
golden = "pcengine/S2-pad.png"
golden_sha256 = "cbde246c7934daa55f9e5c5d6194dd053a34eb90d8cebce670fa9f62a446d3e7"
compare = { mode = "similarity", max_mad = 0.5, reason = "the squares are 8 dots wide in both; only the scaling differs" }

# S3: four more cards reach their own screens: Gradius (512 KB power-of-two mirroring), Samurai-Ghost, Cadash (a 384 KB card: two chips, bank bit 6 picks
# the 128 KB one) and Bomberman '93; Street Fighter II' Champion Edition (the 2.5 MB card with the $1FF0 bank window).
[[scenario]]
id = "S3-gradius-600"
kind = "screen"
