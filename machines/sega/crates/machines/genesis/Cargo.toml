[package]
name = "genesis"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Sega Mega Drive / Genesis: memory map, master-clock scheduler and the Machine implementation"

[dependencies]
md-cart = { path = "../../formats/md-cart" }
vdp = { path = "../../chips/vdp" }
sn76489 = { path = "../../chips/sn76489" }
ym2612 = { path = "../../chips/ym2612" }
machine = { path = "../../../../../shared/crates/machine" }
mc68000 = { path = "../../../../../shared/crates/core/68000" }
z80 = { path = "../../../../../shared/crates/core/z80" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
crc32fast = "1"
