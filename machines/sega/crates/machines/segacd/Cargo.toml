[package]
name = "segacd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Sega CD / Mega-CD: the sub-CPU system on the Genesis cartridge port"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
crc32fast = "1"
genesis = { path = "../genesis" }
mcd-gate-array = { path = "../../chips/mcd-gate-array" }
rf5c164 = { path = "../../chips/rf5c164" }
mcd-asic = { path = "../../chips/mcd-asic" }
disc = { path = "../../formats/disc" }
mc68000 = { package = "rc-mc68000", version = "0.1" }
machine = { package = "rc-machine", version = "0.1" }