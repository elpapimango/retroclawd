[package]
name = "disc"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "CD images: cue sheets, BIN and ISO files, sector reads and the table of contents"

[dependencies]
chd = { package = "rc-chd", version = "0.1" }
[dev-dependencies]
chd = { package = "rc-chd", version = "0.1", features = ["builder"] }