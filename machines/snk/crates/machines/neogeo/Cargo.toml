[package]
name = "neogeo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Neo Geo (MVS/AES cartridge) machine: the 68000's bus"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
mc68000 = { package = "rc-mc68000", version = "0.1" }
machine = { package = "rc-machine", version = "0.1" }
z80 = { package = "rc-z80", version = "0.1" }
neo-set = { path = "../../formats/neo-set" }
ym2610 = { path = "../../chips/ym2610" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
crc32fast = "1"

[dev-dependencies]
