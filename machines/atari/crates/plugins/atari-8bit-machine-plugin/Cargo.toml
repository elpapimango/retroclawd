[package]
name = "atari-8bit-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "atari_8bit_machine_plugin_impl"

[dependencies]
atari-8bit = { path = "../../machines/atari-8bit" }
gtia = { path = "../../chips/gtia" }
machine = { package = "rc-machine", version = "0.1" }
plugin-api = { path = "../../../../../shared/crates/plugin-api" }
mos6502 = { package = "rc-mos6502", version = "0.1" }
build-info = { path = "../../../../../shared/crates/build-info" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }

[build-dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
