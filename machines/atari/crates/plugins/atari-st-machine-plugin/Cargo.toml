[package]
name = "atari-st-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "atari_st_machine_plugin_impl"

[dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
machine = { package = "rc-machine", version = "0.1" }
mc68000 = { package = "rc-mc68000", version = "0.1" }
plugin-api = { path = "../../../../../shared/crates/plugin-api" }
serde = { version = "1", features = ["derive"] }
atari-st = { path = "../../machines/atari-st" }

[build-dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }

[features]
debug = ["atari-st/debug"]
