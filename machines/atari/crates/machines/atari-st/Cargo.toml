[package]
name = "atari-st"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Atari ST/STF/STFM: memory map, event scheduler and the Machine implementation"

[dependencies]
machine = { path = "../../../../../shared/crates/machine" }
mc68000 = { path = "../../../../../shared/crates/core/68000" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
crc32fast = "1"
sha1 = "0.10"
mc68901 = { path = "../../chips/mc68901" }
st-shifter = { path = "../../chips/st-shifter" }
blitter = { path = "../../chips/blitter" }
ay-3-8910 = { path = "../../../../../shared/crates/chips/ay-3-8910" }
mc6850 = { path = "../../../../../shared/crates/chips/mc6850" }
ikbd = { path = "../../chips/ikbd" }
st-floppy = { path = "../../formats/st-floppy" }
wd1770 = { path = "../../../../../shared/crates/chips/wd1770" }
