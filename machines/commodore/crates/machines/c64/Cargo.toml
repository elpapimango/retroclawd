[package]
name = "c64"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
machine = { package = "rc-machine", version = "0.1" }
mos6502 = { package = "rc-mos6502", version = "0.1" }
vic-ii = { path = "../../chips/vic-ii" }
sid = { path = "../../chips/sid" }
cia6526 = { path = "../../chips/cia-6526" }
acia6551 = { path = "../../chips/acia-6551" }
cs8900a = { path = "../../chips/cs8900a" }
c64-tape = { package = "rc-c64-tape", version = "0.1" }
c64-cartridge = { package = "rc-c64-cartridge", version = "0.1" }
cbm-dos = { package = "rc-cbm-dos", version = "0.1" }
d64 = { package = "rc-d64", version = "0.1" }
d71 = { package = "rc-d71", version = "0.1" }
d81 = { package = "rc-d81", version = "0.1" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }

[dev-dependencies]
# Only for tests/iec_1541.rs, which proves the real IEC bus wiring between
# this crate and c1541 actually works end to end -- neither crate has a
# production dependency on the other in either direction, this is purely a
# test-time coupling Cargo's own dev-dependency mechanism exists for.
c1541 = { path = "../1541" }
c64-tape = { package = "rc-c64-tape", version = "0.1" }