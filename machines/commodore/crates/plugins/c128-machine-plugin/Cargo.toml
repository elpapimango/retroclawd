[package]
name = "c128-machine-plugin"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "c128_machine_plugin_impl"

[dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
machine = { package = "rc-machine", version = "0.1" }
plugin-api = { path = "../../../../../shared/crates/plugin-api" }
mos6502 = { package = "rc-mos6502", version = "0.1" }
z80 = { package = "rc-z80", version = "0.1" }
serde = { version = "1", features = ["derive"] }
c128 = { path = "../../machines/c128" }
c1541 = { path = "../../machines/1541" }
drive-link = { path = "../../machines/drive-link" }
d64 = { package = "rc-d64", version = "0.1" }
g64 = { package = "rc-g64", version = "0.1" }
d71 = { package = "rc-d71", version = "0.1" }
d81 = { package = "rc-d81", version = "0.1" }
[dev-dependencies]
plugin-api = { path = "../../../../../shared/crates/plugin-api", features = ["testkit"] }
toml = "0.8"

[build-dependencies]
build-info = { path = "../../../../../shared/crates/build-info" }
