[package]
name = "retroclawd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
build-info = { path = "../../shared/crates/build-info" }
clap = { version = "4", features = ["derive", "wrap_help", "string"] }
png = "0.18"
terminal_size = "0.4"
winit = "0.30"
cpal = "0.17"
rfd = "0.17"
# Clipboard text for the paste hotkey (no image support needed).
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
bevy = { version = "0.19", default-features = false, features = ["2d", "keyboard", "mouse", "bevy_ui", "bevy_text", "bevy_ui_render", "default_font", "bevy_audio"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha1 = "0.10"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
# --firmware auto takes a published firmware out of its release zip.
zip = { version = "2", default-features = false, features = ["deflate"] }
machine = { package = "rc-machine", version = "0.1" }
z80 = { package = "rc-z80", version = "0.1" }
mos6502 = { package = "rc-mos6502", version = "0.1" }
plugin-api = { path = "../../shared/crates/plugin-api" }
game-config = { path = "../../crates/formats/game-config" }
app-config = { path = "../../crates/formats/app-config" }
file-loader = { path = "../../crates/formats/file-loader" }
pok = { path = "../../crates/formats/pok", optional = true }
# The machines, linked into the program. One feature per family (and per kind of machine, for the
# slimmer builds); a build with none has no machine to run.
zx81-machine-plugin = { path = "../../machines/sinclair/crates/plugins/zx81-machine-plugin", optional = true }
zx-spectrum-machine-plugin = { path = "../../machines/sinclair/crates/plugins/zx-spectrum-machine-plugin", optional = true }
cpc-machine-plugin = { path = "../../machines/amstrad/crates/plugins/cpc-machine-plugin", optional = true }
c64-machine-plugin = { path = "../../machines/commodore/crates/plugins/c64-machine-plugin", optional = true }
c128-machine-plugin = { path = "../../machines/commodore/crates/plugins/c128-machine-plugin", optional = true }
vic20-machine-plugin = { path = "../../machines/commodore/crates/plugins/vic20-machine-plugin", optional = true }
atari-st-machine-plugin = { path = "../../machines/atari/crates/plugins/atari-st-machine-plugin", optional = true }
atari-8bit-machine-plugin = { path = "../../machines/atari/crates/plugins/atari-8bit-machine-plugin", optional = true }
neogeo-machine-plugin = { path = "../../machines/snk/crates/plugins/neogeo-machine-plugin", optional = true }
sega-machine-plugin = { path = "../../machines/sega/crates/plugins/sega-machine-plugin", optional = true }
tiny_http = { version = "0.12", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "time"], optional = true }

[features]
# `rcd` is the player: every machine, no debugging code at all. `rcdd` is the same program with the `debug`
# feature (debuggers, ZRCP, tracing, watch points, the diagnostic reports), see `[[bin]]` below.
default = ["all-machines"]
all-machines = ["home", "console", "arcade"]
# The machines, by kind. A family feature links that family's machines into the program.
home = ["sinclair", "amstrad", "commodore", "atari"]
console = ["sega", "snk"]
arcade = ["snk"]
# The single-kind programs: rcda (arcade), rcdc (console), rcdh (home). Build each with `--no-default-features`
# and its own feature (tools/build_all.sh --variant a|c|h does); a variant that finds a machine of another kind
# linked in does not compile.
variant-arcade = ["arcade"]
variant-console = ["console"]
variant-home = ["home"]
sinclair = ["dep:zx81-machine-plugin", "dep:zx-spectrum-machine-plugin"]
amstrad = ["dep:cpc-machine-plugin"]
commodore = ["dep:c64-machine-plugin", "dep:c128-machine-plugin", "dep:vic20-machine-plugin"]
atari = ["dep:atari-st-machine-plugin", "dep:atari-8bit-machine-plugin"]
snk = ["dep:neogeo-machine-plugin"]
sega = ["dep:sega-machine-plugin"]
# Everything for developing: the debuggers and every trace/diagnostic hook in the program and the machines.
debug = [
    "debug-ui", "debug-zrcp", "debug-log", "machine/debug",
    "zx81-machine-plugin?/debug", "zx-spectrum-machine-plugin?/debug", "cpc-machine-plugin?/debug",
    "atari-st-machine-plugin?/debug", "sega-machine-plugin?/debug", "neogeo-machine-plugin?/debug",
]
debug-ui = ["dep:tiny_http", "dep:pok"]
debug-zrcp = []
debug-log = ["dep:tracing-subscriber"]
profiling = ["bevy/trace_tracy"]

[lib]
name = "retroclawd"
path = "src/lib.rs"

[[bin]]
name = "rcd"
path = "src/bin/rcd.rs"

[[bin]]
name = "rcdd"
path = "src/bin/rcdd.rs"
required-features = ["debug"]

[[bin]]
name = "rcda"
path = "src/bin/rcda.rs"
required-features = ["variant-arcade"]

[[bin]]
name = "rcdc"
path = "src/bin/rcdc.rs"
required-features = ["variant-console"]

[[bin]]
name = "rcdh"
path = "src/bin/rcdh.rs"
required-features = ["variant-home"]

[build-dependencies]
winresource = "0.1"
build-info = { path = "../../shared/crates/build-info" }

[dev-dependencies]
# A do-nothing machine for the unit tests: no machine code lives in this repository.
test-machine-plugin = { path = "../../crates/plugins/test-machine-plugin" }
zip = { version = "2", default-features = false, features = ["deflate"] }
dsk = { package = "rc-dsk", version = "0.1" }
tempfile = "3"
