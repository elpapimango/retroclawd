[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
zx-tape = { package = "rc-zx-tape", version = "0.1" }
cpc-snapshot = { package = "rc-cpc-snapshot", version = "0.1" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
opt-level = "s"

[profile.profiling]
inherits = "release"
debug = true

[profile.release.package.antic]
opt-level = 3

[profile.release.package.atari-8bit]
opt-level = 3

[profile.release.package.rc-atari-media]
opt-level = 3

[profile.release.package.atari-st]
