[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
atari-media = { path = "machines/atari/crates/formats/atari-media" }
machine = { path = "shared/crates/machine" }
z80 = { path = "shared/crates/core/z80" }
mos6502 = { path = "shared/crates/core/6502" }
mc68000 = { path = "shared/crates/core/68000" }
cbm-dos = { path = "machines/commodore/crates/formats/cbm-dos" }
d64 = { path = "machines/commodore/crates/formats/d64" }
d71 = { path = "machines/commodore/crates/formats/d71" }
d81 = { path = "machines/commodore/crates/formats/d81" }
g64 = { path = "machines/commodore/crates/formats/g64" }
c64-tape = { path = "machines/commodore/crates/formats/c64-tape" }
dsk = { path = "shared/crates/formats/dsk" }
zx-tape = { path = "shared/crates/formats/zx-tape" }
z80-snapshot = { path = "machines/sinclair/crates/formats/z80-snapshot" }
sna-snapshot = { path = "machines/sinclair/crates/formats/sna-snapshot" }
szx-snapshot = { path = "machines/sinclair/crates/formats/szx-snapshot" }
zx81-snapshot = { path = "machines/sinclair/crates/formats/zx81-snapshot" }
cpc-snapshot = { path = "machines/amstrad/crates/formats/cpc-snapshot" }
cpc-cartridge = { path = "machines/amstrad/crates/formats/cpc-cartridge" }
c64-cartridge = { path = "machines/commodore/crates/formats/c64-cartridge" }
chd = { path = "machines/sega/crates/formats/chd" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
opt-level = "s"

[profile.profiling]
inherits = "release"
debug = true

[profile.release.package.antic]
opt-level = 3

[profile.release.package.atari-8bit]
opt-level = 3

