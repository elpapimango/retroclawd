name: Setup Rust toolchain on Linux
description: Install Linux system packages, Rust toolchain, and restore cargo cache.

inputs:
  rust-components:
    description: Optional comma-separated rustup components for dtolnay/rust-toolchain.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev

    - name: Install Rust toolchain (with components)
      if: ${{ inputs.rust-components != '' }}
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.rust-components }}

    - name: Install Rust toolchain
      if: ${{ inputs.rust-components == '' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Restore Rust build cache
      uses: Swatinem/rust-cache@v2
