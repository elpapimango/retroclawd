name: Release artifacts

# Manual: builds `rcd` (play), `rcdd` (develop) and the single-kind `rcda`, `rcdc`, `rcdh` on each platform and uploads the archives made by
# .github/scripts/package_release.sh. Each archive holds the five executables and nothing else: every machine
# is linked into them. Only the Linux leg has been run by hand so far; check the Windows and macOS legs the
# first time they are used.
on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - if: matrix.os == 'ubuntu-24.04'
        uses: ./.github/actions/setup-rust-linux
      - run: bash .github/scripts/package_release.sh
      - uses: actions/upload-artifact@v6
        with:
          name: retroclawd-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: retroclawd-${{ matrix.os }}-zip
          path: dist/*.zip
          if-no-files-found: ignore
