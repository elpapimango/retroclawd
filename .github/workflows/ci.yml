name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust-linux
        with:
          rust-components: rustfmt
      - run: cargo fmt --check
      # rcd: every machine, no debugging code.
      - run: cargo build --release -p retroclawd --bin rcd
      # rcdd: the same program with the `debug` feature.
      - run: cargo build --release -p retroclawd --bin rcdd --features debug --target-dir target/release-debug
      # The unit tests run with the debug feature on (the debug hooks have tests); the app also has to
      # build and pass without it.
      - run: cargo test --workspace --features debug
      - run: cargo test -p retroclawd
