name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The shared crates are the submodule `shared/` (retroclawd-crates).
      - name: check out shared/
        run: git submodule update --init shared
      - uses: ./.github/actions/setup-rust-linux
        with:
          rust-components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
