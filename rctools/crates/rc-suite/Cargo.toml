[package]
name = "rc-suite"
description = "Per-machine emulator test suites for retroclawd, built with the retroclawd tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rc_suite"

[[bin]]
name = "rc-scenarios"
path = "src/bin/rc-scenarios.rs"

[dependencies]
png = "0.18"
serde.workspace = true
toml.workspace = true
clap.workspace = true
sha2 = "0.10"
rcasm = { version = "0.1" }
cpc-snapshot.workspace = true

[dev-dependencies]
rcld = { version = "0.1" }
rcdisk = { version = "0.1" }
rcsnap = { version = "0.1" }
zx-tape.workspace = true
